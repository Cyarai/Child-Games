<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spelling Scramble</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body class="game-page">
  <div class="game-header">
    <a href="../../index.html" class="btn btn-back btn-sm">← Back to Games</a>
    <h1>✏️ Spelling Scramble</h1>
    <p class="subtitle">Unscramble the letters to spell the word!</p>
  </div>

  <div class="game-container">
    <div class="game-panel">
      <div class="game-stats">
        <span class="stat-pill">Word: <span id="word-num">1</span>/5</span>
        <span class="stat-pill">Score: <span id="score">0</span></span>
      </div>
      <p class="word-hint" id="word-hint">Hint: a furry pet that barks</p>
      <div class="scramble-display" id="scramble"></div>
      <div class="answer-area">
        <input type="text" id="answer-input" class="answer-input" autocomplete="off" autocapitalize="none" placeholder="Type your answer">
        <button class="btn btn-primary" id="btn-check">Check</button>
      </div>
      <div class="letter-hints" id="letter-hints"></div>
    </div>
  </div>

  <div class="overlay visible" id="start-overlay">
    <div class="overlay-box">
      <div class="overlay-emoji">✏️</div>
      <h2>Spelling Scramble</h2>
      <p>Look at the scrambled letters and type the correct word. 5 words to spell!</p>
      <button class="btn btn-primary" id="btn-start">Start Game</button>
    </div>
  </div>

  <div class="overlay" id="win-overlay">
    <div class="overlay-box">
      <div class="overlay-emoji">📚</div>
      <h2>Spelling Star!</h2>
      <p id="win-message"></p>
      <div id="win-stars" class="stars" style="font-size:2rem;margin-bottom:1rem;"></div>
      <div class="game-actions">
        <button class="btn btn-primary" id="btn-play-again">Play Again</button>
        <a href="../../index.html" class="btn btn-outline">Back to Hub</a>
      </div>
    </div>
  </div>

  <button class="sound-toggle" id="sound-toggle" aria-label="Toggle sound">🔊</button>
  <script src="../../assets/common.js"></script>
  <script src="game.js"></script>
</body>
</html>

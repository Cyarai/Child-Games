<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emoji Memory</title>
  <link rel="stylesheet" href="../../assets/style.css">
  <link rel="stylesheet" href="game.css">
</head>
<body class="game-page">
  <div class="game-header">
    <a href="../../index.html" class="btn btn-back btn-sm">← Back to Games</a>
    <h1>🧠 Emoji Memory</h1>
    <p class="subtitle">Find all the matching emoji pairs!</p>
  </div>

  <div class="game-container">
    <div class="game-panel">
      <div class="game-stats">
        <span class="stat-pill">Moves: <span id="moves">0</span></span>
        <span class="stat-pill">Pairs: <span id="pairs">0</span>/8</span>
      </div>
      <div class="memory-grid" id="board"></div>
    </div>
  </div>

  <div class="overlay visible" id="start-overlay">
    <div class="overlay-box">
      <div class="overlay-emoji">🧠</div>
      <h2>Emoji Memory</h2>
      <p>Flip cards and find all 8 emoji pairs. Can you do it in few moves?</p>
      <button class="btn btn-primary" id="btn-start">Start Game</button>
    </div>
  </div>

  <div class="overlay" id="win-overlay">
    <div class="overlay-box">
      <div class="overlay-emoji">🏆</div>
      <h2>Memory Master!</h2>
      <p id="win-message"></p>
      <div id="win-stars" class="stars" style="font-size:2rem;margin-bottom:1rem;"></div>
      <div class="game-actions">
        <button class="btn btn-primary" id="btn-play-again">Play Again</button>
        <a href="../../index.html" class="btn btn-outline">Back to Hub</a>
      </div>
    </div>
  </div>

  <button class="sound-toggle" id="sound-toggle" aria-label="Toggle sound">🔊</button>
  <script src="../../assets/common.js"></script>
  <script src="game.js"></script>
</body>
</html>
